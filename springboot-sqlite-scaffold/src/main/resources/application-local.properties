# Local profile: always SQLite
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:${user.home}/springboot-sqlite-scaffold-local.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.example.scaffold.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execute SQL script after Hibernate creates tables
spring.sql.init.data-locations=classpath:schema-sqlite.sql
spring.sql.init.mode=always
