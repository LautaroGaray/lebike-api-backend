# Dev profile: SQL provider (e.g., Railway PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Configuration (dev)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# Caching Configuration
spring.cache.type=simple

# JWT — usar variable de entorno si existe, fallback solo para dev local
security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-prod}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}
