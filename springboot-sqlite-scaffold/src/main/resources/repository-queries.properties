repository.query.example.findAll=select e from Example e order by e.id
repository.query.users.findAll=select u from Users u order by u.id
repository.query.users.findByEmail=select u from Users u where lower(u.email) = lower(:email)
repository.query.users.findByUsername=select u from Users u where lower(u.username) = lower(:username)
repository.query.roles.findAll=select r from Role r order by r.id
repository.query.roles.findByName=select r from Role r where upper(r.name) = upper(:name)
repository.query.modules.findAll=select m from Module m order by m.id
repository.query.modules.findByMainId=select m from Module m where m.mainId = :mainId
repository.query.rolePermissions.findAll=select rp from RolePermissions rp order by rp.id
repository.query.rolePermissions.findByRoleId=select rp from RolePermissions rp where rp.role.id = :roleId order by rp.id
repository.query.rolePermissions.findByRoleModulePermission=select rp from RolePermissions rp where rp.role.id = :roleId and rp.module.id = :moduleId and rp.permission.id = :permissionId
repository.query.rolePermissions.deleteByRoleId=delete from RolePermissions rp where rp.role.id = :roleId
repository.query.userPermissions.findAll=select up from UserPermissions up order by up.id
repository.query.userPermissions.findByUserId=select up from UserPermissions up where up.user.id = :userId order by up.id
repository.query.userPermissions.findByUserModulePermission=select up from UserPermissions up where up.user.id = :userId and up.module.id = :moduleId and up.permission.id = :permissionId
repository.query.userPermissions.deleteByUserId=delete from UserPermissions up where up.user.id = :userId
repository.query.permissions.findAll=select p from Permissions p order by p.id
repository.query.permissions.findByCode=select p from Permissions p where upper(p.code) = upper(:code)
