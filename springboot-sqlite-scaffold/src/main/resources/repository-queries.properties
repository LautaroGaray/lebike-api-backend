repository.query.example.findAll=select e from Example e order by e.id
repository.query.users.findAll=select u from Users u order by u.id
repository.query.users.findByEmail=select u from Users u where lower(u.email) = lower(:email)
repository.query.users.findByUsername=select u from Users u where lower(u.username) = lower(:username)
repository.query.roles.findAll=select r from Role r order by r.id
repository.query.roles.findByName=select r from Role r where upper(r.name) = upper(:name)
repository.query.modules.findAll=select m from Module m order by m.id
repository.query.modules.findByMainId=select m from Module m where m.mainId = :mainId
repository.query.rolePermissions.findAll=select rp from RolePermissions rp order by rp.id
repository.query.rolePermissions.findByRoleId=select rp from RolePermissions rp join fetch rp.module join fetch rp.permission where rp.role.id = :roleId order by rp.id
repository.query.rolePermissions.findByRoleModulePermission=select rp from RolePermissions rp where rp.role.id = :roleId and rp.module.id = :moduleId and rp.permission.id = :permissionId
repository.query.rolePermissions.deleteByRoleId=delete from RolePermissions rp where rp.role.id = :roleId
repository.query.userPermissions.findAll=select up from UserPermissions up order by up.id
repository.query.userPermissions.findByUserId=select up from UserPermissions up join fetch up.module join fetch up.permission where up.user.id = :userId order by up.id
repository.query.userPermissions.findByUserModulePermission=select up from UserPermissions up where up.user.id = :userId and up.module.id = :moduleId and up.permission.id = :permissionId
repository.query.userPermissions.deleteByUserId=delete from UserPermissions up where up.user.id = :userId
repository.query.permissions.findAll=select p from Permissions p order by p.id
repository.query.permissions.findByCode=select p from Permissions p where upper(p.code) = upper(:code)
repository.query.key.findAll=select k from Keys k order by k.Id desc
repository.query.key.findByTargetDestiny=select k from Keys k where upper(k.targetDestiny) = upper(:targetDestiny)
repository.query.receipts.findAll=select r from Receipt r
repository.query.receipts.findAllOrderByIdDesc=select r from Receipt r order by r.Id desc
repository.query.receipts.findByUserAndWarehouseOrderByIdDesc=select r from Receipt r where r.user.id = :userId and (upper(r.origin) = upper(:warehouseCode) or upper(r.destiny) = upper(:warehouseCode)) order by r.Id desc
repository.query.receipts.existsByArticleIdAndStatusLessThan=select count(rd.Id) from ReceiptDetail rd where rd.article.id = :articleId and rd.receipt.status < :status
repository.query.receiptStatusLog.findAll=select rsl from ReceiptStatusLog rsl order by rsl.id desc
repository.query.receiptStatusLog.findByReceiptIdOrderByChangedAtDesc=select rsl from ReceiptStatusLog rsl where rsl.receiptId = :receiptId order by rsl.changedAt desc
repository.query.receiptStatusHistory.findAll=select rsh from ReceiptStatusHistory rsh order by rsh.Id desc
repository.query.receiptStatusHistory.findByReceiptId=select rsh from ReceiptStatusHistory rsh where rsh.receiptId = :receiptId order by rsh.creationDate desc
repository.query.repair.findAll=select r from Repair r order by r.Id desc
repository.query.repair.findAllOrderByIdDesc=select r from Repair r order by r.Id desc
repository.query.repair.findByWarehouseCode=select r from Repair r where upper(r.warehouse.code) = upper(:code) order by r.Id desc
repository.query.repair.findByUserId=select r from Repair r where r.user.id = :userId order by r.Id desc
repository.query.repairAudit.findAll=select ra from RepairAudit ra order by ra.Id desc
repository.query.repairAudit.findByRepairId=select ra from RepairAudit ra where ra.repairId = :repairId order by ra.creationDate desc
